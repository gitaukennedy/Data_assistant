version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: data_assistant_db
    environment:
      POSTGRES_DB: company_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 0000
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: data_assistant_api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg2://postgres:0000@postgres:5432/company_db
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      FLASK_ENV: production
      FLASK_PORT: 5000
    ports:
      - "5000:5000"
    volumes:
      - ./chromadb:/app/chromadb
    command: python main.py --mode web

volumes:
  postgres_data: